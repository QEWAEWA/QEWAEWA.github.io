{% extends "base.html" %}

{% block title %}Карта - Наир{% endblock %}

{% block content %}

<!-- Правый блок - основной контент -->
  <div class="map-container" id="mapContainer">
    <img src="static/photo/Karta.png" alt="Карта Наира" class="map-image" id="mapImage">
    
    <!-- Кнопки управления картой -->
    <div class="map-controls">
      <button class="map-btn" id="resetBtn" title="Сбросить">⟲</button>
      <button class="map-btn" id="zoomInBtn" title="Увеличить">+</button>
      <button class="map-btn" id="zoomOutBtn" title="Уменьшить">-</button>
    </div>
  </div>
  
<!-- Подключение скрипта карты -->
<script src="static/js/map.js"></script>

<script>
// Отладочный скрипт для проверки кликов
console.log('=== ПРОВЕРКА КНОПОК КАРТЫ ===');

document.addEventListener('click', function(e) {
    if (e.target.classList.contains('map-btn')) {
        console.log('🎯 Клик по кнопке:', e.target.id);
    }
});

// Проверяем элементы
console.log('Элементы карты:');
console.log('mapContainer:', document.getElementById('mapContainer'));
console.log('mapImage:', document.getElementById('mapImage'));
console.log('resetBtn:', document.getElementById('resetBtn'));
console.log('zoomInBtn:', document.getElementById('zoomInBtn'));
console.log('zoomOutBtn:', document.getElementById('zoomOutBtn'));
</script>
{% endblock %}
