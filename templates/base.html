<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Наир - текстовая фэнтези ролевая игра">
    <meta name="theme-color" content="#0f0e14">
    <title>{% block title %}Наир - текстовая фэнтези ролевая{% endblock %}</title>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Ваши кастомные стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=20260709">
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='photo/favicon.ico') }}" type="image/x-icon">
</head>
<body>
    <!-- Шапка сайта с поиском -->
    <header class="site-header">
        <button class="nav-toggle" id="navToggle" aria-label="Открыть/Закрыть меню">
            <i class="bi bi-list"></i>
        </button>
        
        <div class="header-brand">
            <a href="index.html" class="header-logo">НАИР</a>
        </div>
        
        <div class="header-right">
            <div class="header-search">
                <i class="bi bi-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Поиск...">
                <div class="suggestions"></div>
            </div>
            
            <a href="https://vk.com/club182026147" class="header-vk-link" target="_blank" rel="noopener noreferrer">
                <img src="{{ url_for('static', filename='photo/Eg9cTKOCTXIN7bSpR3KcbSA92y4.png') }}" alt="VK">
            </a>
        </div>
    </header>

    <div class="content-wrapper">
        <!-- Навигация (левая панель) -->
        <nav class="original-nav" id="navMenu">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html" class="nav-link">Главная</a></li>
                
                <!-- Разделительная линия ПОСЛЕ кнопки Главная -->
                <div class="nav-divider"></div>
                
                <li class="nav-item"><a href="karta.html" class="nav-link">Карта</a></li>
                <li class="nav-item"><a href="magic.html" class="nav-link">Магия</a></li>
                <li class="nav-item"><a href="economy.html" class="nav-link">Экономика</a></li>
                <li class="nav-item"><a href="leveling.html" class="nav-link">Система прокачки</a></li>
                <li class="nav-item"><a href="ankety.html" class="nav-link">Анкеты</a></li>
                <li class="nav-item"><a href="kuznec.html" class="nav-link">Кузнечество</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">О Проекте</a></li>
            </ul>
        </nav>

        <!-- Основной контент -->
        <main class="original-main">
            <!-- Хлебные крошки (автоматические, через JS) -->
            <div class="breadcrumbs" id="breadcrumbs">
                <a href="index.html" class="breadcrumb-link">Главная</a>
                <span class="breadcrumb-separator">›</span>
                <span class="breadcrumb-current" id="breadcrumbCurrent">Загрузка...</span>
            </div>
            
            {% block content %}{% endblock %}
        </main>

        <!-- Боковая панель содержания-->
        <aside class="toc-sidebar" id="tocSidebar">
            <div class="toc-header">
                <i class="bi bi-list-ul"></i>
                <span>Содержание</span>
            </div>
            <nav class="toc-nav" id="tocNav"></nav>
        </aside>
    </div>
    
    <!-- Скрипты -->
    <script>
        // Мобильное меню
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');
        const navLinks = navMenu ? navMenu.querySelectorAll('.nav-link') : [];
        
        // Открытие/закрытие меню
        if (navToggle && navMenu) {
            navToggle.addEventListener('click', function() {
                navMenu.classList.toggle('mobile-open');
                navToggle.classList.toggle('active');
            });
        }
        
        // Закрытие меню при клике на ссылку
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                navMenu.classList.remove('mobile-open');
                navToggle.classList.remove('active');
            });
        });
        
        // Закрытие меню при клике вне его на мобилах
        document.addEventListener('click', function(event) {
            if (!navMenu || !navToggle) return;
            const isClickInsideNav = navMenu.contains(event.target);
            const isClickOnToggle = navToggle.contains(event.target);
            
            if (!isClickInsideNav && !isClickOnToggle && window.innerWidth <= 768) {
                navMenu.classList.remove('mobile-open');
                navToggle.classList.remove('active');
            }
        });
        
        // Закрытие меню при изменении размера окна
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                if (navMenu) navMenu.classList.remove('mobile-open');
                if (navToggle) navToggle.classList.remove('active');
            }
        });
        
        // Определение активной страницы
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage || (currentPage === '' && href === 'index.html')) {
                link.classList.add('active');
            }
        });
        
        // Поиск
        const searchInput = document.querySelector('.header-search .search-input');
        const suggestionsDiv = document.querySelector('.header-search .suggestions');
        if (searchInput && suggestionsDiv) {
            const searchItems = [
                { text: 'Главная', href: 'index.html' },
                { text: 'Карта', href: 'karta.html' },
                { text: 'Магия', href: 'magic.html' },
                { text: 'Экономика', href: 'economy.html' },
                { text: 'Система прокачки', href: 'leveling.html' },
                { text: 'Анкеты', href: 'ankety.html' },
                { text: 'Лор', href: 'lor.html' },
                { text: 'Кузнечество', href: 'kuznec.html' },
                { text: 'О Проекте', href: 'about.html' }
            ];
            
            searchInput.addEventListener('input', function(e) {
                const value = e.target.value.toLowerCase().trim();
                
                if (value.length === 0) {
                    suggestionsDiv.style.display = 'none';
                    return;
                }
                
                const filtered = searchItems.filter(item => 
                    item.text.toLowerCase().includes(value)
                );
                
                if (filtered.length === 0) {
                    suggestionsDiv.style.display = 'none';
                    return;
                }
                
                suggestionsDiv.innerHTML = filtered.map(item => `
                    <div class="suggestion-item" onclick="window.location.href='${item.href}'">
                        ${item.text}
                    </div>
                `).join('');
                suggestionsDiv.style.display = 'block';
            });
            
            // Закрытие подсказок при клике вне
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.header-search')) {
                    suggestionsDiv.style.display = 'none';
                }
            });
        }
        
        // Автоматические хлебные крошки на основе истории
        function setupBreadcrumbs() {
            const breadcrumbs = document.getElementById('breadcrumbs');
            if (!breadcrumbs) return;
            
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            
            const pageNames = {
                'index.html': 'Главная',
                'karta.html': 'Карта',
                'magic.html': 'Магия',
                'economy.html': 'Экономика',
                'kuznec.html': 'Кузнечество',
                'leveling.html': 'Система прокачки',
                'ankety.html': 'Анкеты',
                'lor.html': 'Лор',
                'about.html': 'О Проекте'
            };
            
            const getName = (file) => pageNames[file] || 
                file.replace('.html', '').charAt(0).toUpperCase() + file.replace('.html', '').slice(1);
            
            const storageKey = 'nair_breadcrumb_trail';
            let trail = [];
            
            try {
                const saved = sessionStorage.getItem(storageKey);
                if (saved) trail = JSON.parse(saved);
            } catch(e) {}
            
            // Если текущая страница уже есть в trail — обрезаем до неё (клик по хлебной крошке или Назад)
            const existingIndex = trail.indexOf(currentPage);
            if (existingIndex !== -1) {
                trail = trail.slice(0, existingIndex + 1);
            } else {
                // Иначе — добавляем текущую страницу в конец (переход вперёд)
                trail.push(currentPage);
            }
            
            // Ограничиваем длину (макс 5 шагов)
            if (trail.length > 5) {
                trail = trail.slice(trail.length - 5);
            }
            
            // Сохраняем
            try {
                sessionStorage.setItem(storageKey, JSON.stringify(trail));
            } catch(e) {}
            
            // Строим хлебные крошки
            breadcrumbs.innerHTML = '';
            
            for (let i = 0; i < trail.length; i++) {
                const fileName = trail[i];
                const name = getName(fileName);
                
                if (i > 0) {
                    const sep = document.createElement('span');
                    sep.className = 'breadcrumb-separator';
                    sep.textContent = '›';
                    breadcrumbs.appendChild(sep);
                }
                
                if (i === trail.length - 1) {
                    const span = document.createElement('span');
                    span.className = 'breadcrumb-current';
                    span.id = 'breadcrumbCurrent';
                    span.textContent = name;
                    breadcrumbs.appendChild(span);
                } else {
                    const link = document.createElement('a');
                    link.href = fileName;
                    link.className = 'breadcrumb-link';
                    link.textContent = name;
                    breadcrumbs.appendChild(link);
                }
            }
        }
        
        // Автоматическая генерация содержания (TOC)
        document.addEventListener('DOMContentLoaded', function() {
            // Запускаем хлебные крошки
            setupBreadcrumbs();
            const tocNav = document.getElementById('tocNav');
            const tocSidebar = document.getElementById('tocSidebar');
            if (!tocNav || !tocSidebar) return;
            
            const mainContent = document.querySelector('.original-main');
            if (!mainContent) return;
            
            const headings = mainContent.querySelectorAll('h2, h3');
            if (headings.length === 0) {
                // Показываем заглушку, если нет разделов
                tocNav.innerHTML = '<div class="toc-empty">Нет разделов на странице</div>';
                return;
            }
            
            // Создаем якоря для заголовков без id
            headings.forEach((heading, index) => {
                if (!heading.id) {
                    heading.id = 'section-' + index;
                }
            });
            
            // Строим TOC
            tocNav.innerHTML = '';
            headings.forEach(heading => {
                const link = document.createElement('a');
                link.href = '#' + heading.id;
                link.className = 'toc-link';
                if (heading.tagName === 'H3') {
                    link.classList.add('toc-link-sub');
                }
                link.textContent = heading.textContent;
                tocNav.appendChild(link);
            });
            
            // Подсветка текущего раздела
            const tocLinks = tocNav.querySelectorAll('.toc-link');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        tocLinks.forEach(l => l.classList.remove('active'));
                        const activeLink = tocNav.querySelector(`[href="#${entry.target.id}"]`);
                        if (activeLink) activeLink.classList.add('active');
                    }
                });
            }, { rootMargin: '-20% 0px -60% 0px', threshold: 0.1 });
            
            headings.forEach(h => observer.observe(h));
        });
    </script>
    
    <!-- Ваши скрипты -->
    {% block scripts %}{% endblock %}
</body>
</html>
