name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Разрешаем только один деплой одновременно
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: 🚀 Checkout
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: 📦 Install Flask
      run: pip install flask
      
    - name: 🔍 Debug file structure
      run: |
        echo "=== СТРУКТУРА ФАЙЛОВ ==="
        find . -type f -name "*.html" -o -name "*.py" | sort
        echo ""
        echo "=== ПАПКА TEMPLATES ==="
        ls -la templates/ || echo "❌ Папка templates не существует!"
        echo ""
        echo "=== СОДЕРЖИМОЕ TEMPLATES ==="
        ls -la templates/*.html 2>/dev/null || echo "Нет HTML файлов в templates"
      
    - name: 🏗️ Build site
      run: python generate_static.py
      
    - name: 📤 Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4